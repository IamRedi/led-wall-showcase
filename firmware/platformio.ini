; LED Wall core firmware/runtime — LED-L002 (Phase 1, frozen spec §4/§11/§12/§13).
; COPY/ADAPT of heritage `PLUTO EQ ACCESSORY/platformio.ini` (env esp32_eq).
; Adaptations: own include path (cross-repo PLUTO PIANO BRAIN include chain is
; discarded debt per spec §21); only FastLED is needed at this phase —
; WebSockets/ArduinoJson arrive with the API phase, arduinoFFT with audio.
; Heritage carry, documented (spec §2 VERIFIED boot-power heritage; §22 power
; verification pending): brownout detector disabled for strip+USB-power boot.
[env:esp32_eq]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
upload_speed = 921600
build_flags =
	-I include
	-I src
	-D CONFIG_ESP32_BROWNOUT_DET=0
lib_deps =
	fastled/FastLED@3.10.3
	links2004/WebSockets@^2.6.1
	bblanchon/ArduinoJson@^7.4.2

; LED-L010 DualShock 4 environment (ADR-LED-L010 D5): the canonical image
; above stays BT-free until DS4 + WiFi coexistence is proven on the real
; device. This env swaps the Arduino core for the Bluepad32 prebuilt core
; (BT-Classic HID host, upstream release 4.1.0) and compiles the DS4 provider
; behind LED_WALL_ENABLE_DS4; identity advertises display.ds4 only here
; (esp32dev is BT-Classic capable).
[env:esp32_eq_ds4]
platform = espressif32
board = esp32dev
framework = arduino
extra_scripts = post:tools/lto_link.py
monitor_speed = 115200
upload_speed = 921600
build_unflags = -fexceptions
; Match the actual protected V5 partition table. Never use PlatformIO upload
; for this task: it also writes bootloader/partition metadata. Install only the
; verified app binary at 0x10000 with the bounded esptool procedure.
board_build.partitions = partitions_existing_4m.csv
build_flags =
	-I include
	-I src
	-D CONFIG_ESP32_BROWNOUT_DET=0
	-D LED_WALL_ENABLE_DS4=1
	-fno-exceptions
	-DNDEBUG
	-flto
platform_packages =
	framework-arduinoespressif32 @ https://github.com/ricardoquesada/esp32-arduino-lib-builder/releases/download/4.1.0/esp32-bluepad32-4.1.0.zip
lib_deps =
	fastled/FastLED@3.10.3
	links2004/WebSockets@^2.6.1
	bblanchon/ArduinoJson@^7.4.2
